<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My Password Manager</title>
  </head>
  <body>
    <div id="app">
      <main style="min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#111827;color:#f8fafc;font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
        <section data-startup-placeholder style="width:min(560px,100%);border:1px solid rgba(255,255,255,.12);border-radius:8px;background:#1f2937;padding:18px;box-shadow:0 18px 48px rgba(0,0,0,.32);">
          <strong>正在启动 My Password Manager...</strong>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const placeholder = document.querySelector('[data-startup-placeholder]')
        if (!placeholder) return
        window.setTimeout(() => {
          if (!document.body.contains(placeholder)) return
          const message = location.protocol === 'file:'
            ? '请使用桌面端、Android 应用或本地 HTTP 服务打开此页面。'
            : '请刷新页面；如果仍未启动，请检查浏览器控制台中的错误。'
          placeholder.innerHTML = `<strong>应用未能启动</strong><div style="margin-top:8px;color:#cbd5e1;">${message}</div>`
        }, 4000)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
