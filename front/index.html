<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>My Password Manager</title>
    <style>
      html, body {
        background-color: #09090b;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main style="min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#09090b;color:#fafafa;font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
        <section data-startup-placeholder style="width:min(420px,100%);border:1px solid rgba(255,255,255,.08);border-radius:8px;background:#111114;padding:18px;">
          <strong>正在启动 My Password...</strong>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const placeholder = document.querySelector('[data-startup-placeholder]')
        if (!placeholder) return
        window.setTimeout(() => {
          if (!document.body.contains(placeholder)) return
          const message = location.protocol === 'file:'
            ? '请使用桌面端、Android 应用或本地 HTTP 服务打开此页面。'
            : '请刷新页面；如果仍未启动，请检查浏览器控制台中的错误。'
          placeholder.innerHTML = `<strong>应用未能启动</strong><div style="margin-top:8px;color:#cbd5e1;">${message}</div>`
        }, 4000)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
