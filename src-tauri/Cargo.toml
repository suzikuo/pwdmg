[workspace]
members = [
    ".",
    "crates/core",
    "crates/native_host",
]
resolver = "2"

[package]
name = "mypwdmg-desktop"
version = "2.0.80"
description = "My Password Manager Desktop"
authors = ["suzikuo"]
edition = "2021"

[[bin]]
name = "my-password"
path = "src/main.rs"

[dependencies]
pwdmg-core = { path = "crates/core" }
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
ureq = { version = "2.10", features = ["json"] }
rfd = "0.15"
open = "5.3"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
directories = "5.0"
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
