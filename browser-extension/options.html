<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外观设置 · My Password</title>
  <link rel="stylesheet" href="appearance.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="settings-shell">
    <header class="settings-header">
      <div>
        <p>My Password</p>
        <h1>扩展外观</h1>
        <p>设置工具栏弹窗和网页内面板共用的皮肤与布局。</p>
      </div>
    </header>

    <div class="settings-grid">
      <div class="settings-controls">
        <fieldset id="appearanceControls" disabled>
          <legend class="sr-only">外观设置</legend>
          <section class="settings-card" aria-labelledby="skinHeading">
            <div class="section-heading">
              <div>
                <h2 id="skinHeading">皮肤</h2>
                <p>支持导入 My Password 皮肤 JSON。</p>
              </div>
              <div class="section-actions">
                <input id="skinFile" type="file" accept=".json,application/json" hidden />
                <button id="importSkin" type="button">导入</button>
                <button id="exportSkin" type="button">导出当前皮肤</button>
              </div>
            </div>
            <div id="skinGrid" class="skin-grid" role="radiogroup" aria-labelledby="skinHeading"></div>
            <button id="deleteSkin" class="danger" type="button" hidden>删除当前自定义皮肤</button>
          </section>

          <section class="settings-card" aria-labelledby="layoutHeading">
            <div class="section-heading">
              <h2 id="layoutHeading">主题与布局</h2>
              <button id="resetLayout" type="button" disabled>恢复皮肤布局</button>
            </div>
            <div class="field-grid">
              <label>
                <span>主题模式</span>
                <select id="themeSelect">
                  <option value="system">跟随系统</option>
                  <option value="light">浅色</option>
                  <option value="dark">深色</option>
                </select>
              </label>
              <label>
                <span>弹窗布局</span>
                <select id="modeSelect">
                  <option value="">跟随皮肤</option>
                  <option value="three-pane">标准纵向</option>
                  <option value="top-nav-split">站点与账号分栏</option>
                  <option value="compact-cards">紧凑布局</option>
                </select>
              </label>
              <label>
                <span>账号列表</span>
                <select id="listStyleSelect">
                  <option value="">跟随皮肤</option>
                  <option value="rows">列表</option>
                  <option value="cards">卡片</option>
                  <option value="table">表格</option>
                </select>
              </label>
              <label>
                <span>界面密度</span>
                <select id="densitySelect">
                  <option value="">跟随皮肤</option>
                  <option value="compact">紧凑</option>
                  <option value="comfortable">舒适</option>
                  <option value="airy">宽松</option>
                </select>
              </label>
            </div>
          </section>
        </fieldset>
        <p id="settingsStatus" class="settings-status" role="status" aria-live="polite">正在读取外观设置…</p>
      </div>

      <aside class="preview-card" aria-labelledby="previewHeading">
        <div class="section-heading">
          <h2 id="previewHeading">工具栏弹窗预览</h2>
        </div>
        <div class="preview-window" aria-hidden="true">
          <div class="preview-heading"><strong>My Password</strong><span>已解锁</span></div>
          <div class="preview-layout">
            <div class="preview-site"><strong>example.com</strong><span>打开网页填充面板</span></div>
            <div class="preview-matches">
              <div class="preview-match"><span><strong>个人账号</strong><small>me@example.com</small></span><span class="preview-fill">填充</span></div>
              <div class="preview-match"><span><strong>工作账号</strong><small>work@example.com</small></span><span class="preview-fill">填充</span></div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>
  <script src="builtin-skins.js"></script>
  <script src="appearance.js"></script>
  <script src="options.js"></script>
</body>
</html>
