<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Password</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="brand-mark" aria-hidden="true">MP</div>
      <div class="header-copy">
        <h1>My Password</h1>
        <p id="siteHost">读取当前页面中</p>
      </div>
      <span id="stateBadge" class="state-badge" data-state="checking">检测中</span>
    </header>

    <section class="status-panel" aria-live="polite">
      <div class="status-line">
        <span class="status-dot" aria-hidden="true"></span>
        <p id="status">正在连接本地保险库...</p>
      </div>
      <p id="matchInfo" class="match-info"></p>
    </section>

    <button id="showPanelButton" class="primary-action" type="button">页面弹窗 <span>Alt+T</span></button>

    <form id="unlockForm" class="unlock-form">
      <label for="password">主密码</label>
      <div class="password-row">
        <input id="password" type="password" placeholder="输入主密码" autocomplete="current-password" />
        <button id="unlockButton" type="submit">解锁</button>
      </div>
    </form>

    <div id="matchList" class="match-list" aria-label="当前网站匹配账号"></div>

    <section class="quick-settings" aria-label="自动功能">
      <label class="auto-toggle">
        <span>自动填充</span>
        <input id="autoFillToggle" type="checkbox" role="switch" />
      </label>
      <label class="auto-toggle">
        <span>自动保存</span>
        <input id="autoSaveToggle" type="checkbox" role="switch" />
      </label>
    </section>

    <details class="advanced-settings">
      <summary>
        <span>更多设置</span>
        <small>网站规则与快捷键</small>
      </summary>
      <div class="advanced-settings-body">
        <section id="ignoredSiteSetting" class="ignored-site-setting" hidden>
          <div class="ignored-current">
            <div class="ignored-copy">
              <strong>当前站点</strong>
              <span id="ignoredCurrentState">未忽略</span>
            </div>
            <button id="toggleIgnoredSiteButton" class="secondary" type="button">忽略该网站</button>
          </div>
          <details class="ignored-manager">
            <summary>已忽略网站 <span id="ignoredSiteCount">0</span></summary>
            <div id="ignoredSiteList" class="ignored-site-list"></div>
          </details>
        </section>

        <section class="shortcut-setting">
          <label for="shortcutInput">页面弹窗快捷键</label>
          <div class="shortcut-row">
            <input id="shortcutInput" type="text" readonly value="Alt+T" />
            <button id="resetShortcutButton" class="secondary" type="button">重置</button>
          </div>
        </section>
      </div>
    </details>

    <footer class="popup-actions">
      <button id="refreshButton" class="secondary" type="button">刷新</button>
      <button id="lockButton" class="secondary danger" type="button">锁定</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>

</html>
