<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Password</title>
  <link rel="stylesheet" href="appearance.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <h1>My Password</h1>
      <span id="stateBadge" class="state-badge" data-state="checking">检测中</span>
    </header>

    <div class="popup-body">
      <section class="site-panel" aria-labelledby="siteHost">
        <div class="site-status" aria-live="polite">
          <h2 id="siteHost">正在读取当前网站</h2>
          <p id="status">正在连接本地保险库…</p>
        </div>
        <button id="showPanelButton" class="primary-action" type="button" hidden>
          <span id="showPanelLabel">打开网页填充面板</span>
          <kbd id="showPanelShortcut">Alt+T</kbd>
        </button>
        <form id="unlockForm" class="unlock-form" hidden>
          <label for="password">主密码</label>
          <div class="password-row">
            <input id="password" type="password" placeholder="输入主密码" autocomplete="current-password" />
            <button id="unlockButton" type="submit">解锁</button>
          </div>
          <button id="quickUnlockButton" class="secondary" type="button" hidden>设备快速解锁</button>
        </form>
      </section>

      <section id="matches" class="surface-card matches" aria-labelledby="matchHeading" hidden>
        <div class="section-heading">
          <h2 id="matchHeading">匹配账号</h2>
          <span id="matchCount" class="match-count" hidden></span>
        </div>
        <p id="matchInfo" class="match-info" role="status"></p>
        <div id="matchList" class="match-list"></div>
      </section>
    </div>

    <div id="notice" class="notice" role="status" hidden></div>
    <section class="surface-card quick-settings" aria-label="自动功能">
      <label class="auto-toggle">
        <span>自动填充</span>
        <input id="autoFillToggle" type="checkbox" role="switch" />
      </label>
      <label class="auto-toggle">
        <span>自动保存</span>
        <input id="autoSaveToggle" type="checkbox" role="switch" />
      </label>
    </section>

    <details class="surface-card advanced-settings">
      <summary>网站规则与快捷键</summary>
      <div class="advanced-settings-body">
        <section id="ignoredSiteSetting" class="ignored-site-setting" hidden>
          <div class="ignored-current" id="ignoredCurrent">
            <div class="ignored-copy">
              <strong>当前站点</strong>
              <span id="ignoredCurrentState">未忽略</span>
            </div>
            <button id="toggleIgnoredSiteButton" class="secondary" type="button">忽略该网站</button>
          </div>
          <details class="ignored-manager">
            <summary>已忽略网站 <span id="ignoredSiteCount">0</span></summary>
            <div id="ignoredSiteList" class="ignored-site-list"></div>
          </details>
        </section>

        <section class="shortcut-setting">
          <label for="shortcutInput">网页填充快捷键</label>
          <div class="shortcut-row">
            <input id="shortcutInput" type="text" readonly value="Alt+T" />
            <button id="resetShortcutButton" class="secondary" type="button">重置</button>
          </div>
        </section>
      </div>
    </details>

    <footer class="popup-actions">
      <button id="appearanceButton" class="text-button" type="button">外观设置</button>
      <button id="refreshButton" class="text-button" type="button">刷新状态</button>
      <button id="lockButton" class="text-button" type="button" hidden>锁定保险库</button>
    </footer>
  </main>
  <script src="builtin-skins.js"></script>
  <script src="appearance.js"></script>
  <script src="popup.js"></script>
</body>
</html>
